[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
linemode = "size"


[opener]
edit = [{ run = 'nvim %s', desc = "AstroVim", for = "unix", block = true }]

image = [
  { run = "imv %s1", desc = "Image viewer", for = "linux", orphan = true },
]


extract = [
  { run = "7z x %s1", desc = "Extract here (7-Zip)", block = true, for = "unix" },
]


[open]
rules = [
  { mime = "folder/*", use = [
    "edit",
    "open",
    "reveal",
  ] },
  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  { mime = "image/*", use = [
    "image",
    "reveal",
  ] },
  { mime = "{audio,video}/*", use = [
    "play",
    "reveal",
  ] },

  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
  ] },

  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [
    "edit",
    "reveal",
  ] },
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
  { url = "*", use = [
    "open",
    "reveal",
  ] },
]


[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
