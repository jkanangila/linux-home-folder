# =============================================================================
# Kitty Configuration
# CachyOS / Hyprland / Caelestia / Fish / Neovim
# File: ~/.config/kitty/kitty.conf
# =============================================================================


# =============================================================================
# 1. SHELL & CLIPBOARD
# =============================================================================

shell fish
copy_on_select clipboard

# Remote control through a local Unix socket.
allow_remote_control socket-only
listen_on unix:/tmp/kitty


# =============================================================================
# 2. TYPOGRAPHY
# =============================================================================

font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font Bold
italic_font      BlexMono Nerd Font
bold_italic_font BlexMono Nerd Font Bold

font_size 9.0

# Cursor appearance.
cursor_shape block
cursor_blink_interval 0


# =============================================================================
# 3. WINDOW APPEARANCE
# =============================================================================

remember_window_size yes
hide_window_decorations yes

# Transparency.
background_opacity 0.75
background_blur 20
dynamic_background_opacity yes

# Padding around terminal content.
window_padding_width 0

# Dim inactive panes slightly.
inactive_text_alpha 0.55


# =============================================================================
# 4. VISUAL EFFECTS
# =============================================================================

# Cursor trail.
cursor_trail 5
custom_shaders cursor-trail-blaze

# Disable unnecessary visual noise.
enable_audio_bell no
visual_bell_duration 0.0

# Preserve font ligatures.
disable_ligatures never


# =============================================================================
# 5. SCROLLBACK
# =============================================================================

scrollback_lines 20000


# =============================================================================
# 6. TAB BAR
# =============================================================================

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted


# =============================================================================
# 7. WINDOW LAYOUTS & SPLITS
# =============================================================================

enabled_layouts splits,stack

# Create splits.
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current

# Navigate between neighboring panes.
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right

# Layout management.
map ctrl+shift+l next_layout
map ctrl+alt+z toggle_layout stack
map ctrl+alt+m layout_action maximize


# =============================================================================
# 8. TABS & WINDOWS
# =============================================================================

map ctrl+shift+t new_tab
map ctrl+shift+w close_window

map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Direct tab navigation.
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9


# =============================================================================
# 9. FONT SIZE CONTROLS
# =============================================================================

# Increase font size.
map ctrl+equal change_font_size all +1.0

# Decrease font size.
map ctrl+minus change_font_size all -1.0

# Reset to configured font size (9.0).
map ctrl+0 change_font_size all 0


# =============================================================================
# 10. CONFIGURATION & UTILITIES
# =============================================================================

# Reload Kitty configuration.
map ctrl+shift+f5 load_config_file

# Open Kitty command palette.
map ctrl+shift+p kitten command_palette

# Paste from system clipboard.
map ctrl+v paste_from_clipboard


# =============================================================================
# 11. DYNAMIC THEME
# =============================================================================

# Generated automatically by Caelestia.
include ~/.local/state/caelestia/theme/kitty.conf
# include current-theme.conf
