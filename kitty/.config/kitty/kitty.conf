# =============================================================================
# Kitty configuration
# WSLg | Dracula | UbuntuMono | Neovim workflow
# File: ~/.config/kitty/kitty.conf
# =============================================================================


# Launch zsh in kitty only; system login shell is unchanged
shell /usr/bin/zsh
copy_on_select clipboard

allow_remote_control socket-only
listen_on unix:/tmp/kitty

include current-theme.conf

# -----------------------------------------------------------------------------
# 1. FONT
# -----------------------------------------------------------------------------

font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Make the cursor easy to see.
cursor_shape block
cursor_blink_interval 0

# -----------------------------------------------------------------------------
# 3. WINDOW APPEARANCE
# -----------------------------------------------------------------------------

# Padding around terminal text, measured in points.
window_padding_width 0

hide_window_decorations yes
remember_window_size yes

# Optional subtle transparency. Set to 1.0 for a fully opaque background.
background_opacity 0.8
background_blur 1

# Reduce visual noise.
enable_audio_bell no
visual_bell_duration 0.0

disable_ligatures never


# -----------------------------------------------------------------------------
# 4. SCROLLBACK
# -----------------------------------------------------------------------------

scrollback_lines 20000


# -----------------------------------------------------------------------------
# 5. TABS
# -----------------------------------------------------------------------------

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# -----------------------------------------------------------------------------
# 6. SPLITS AND PANE NAVIGATION
# -----------------------------------------------------------------------------
# Use the splits layout by default.
enabled_layouts splits,stack

map ctrl+shift+enter launch --location=split --cwd=current
# Split into top/bottom panes.
map ctrl+shift+minus launch --location=hsplit --cwd=current
# Split into left/right panes.
map ctrl+shift+backslash launch --location=vsplit --cwd=current

# Move focus between neighboring panes.
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right

# Switch layouts.
map ctrl+shift+l next_layout
map ctrl+alt+z toggle_layout stack

# Enlarge the focused pane and restore the previous layout on repeat.
map ctrl+alt+m layout_action maximize


# -----------------------------------------------------------------------------
# 7. TABS AND WINDOWS
# -----------------------------------------------------------------------------

map ctrl+shift+t new_tab
map ctrl+shift+w close_window

map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Navigate directly to tabs 1 through 9.
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9


# -----------------------------------------------------------------------------
# 8. FONT SIZE
# -----------------------------------------------------------------------------

# map ctrl+shift+equal change_font_size all +1.0
# map ctrl+shift+minus change_font_size all -1.0
# map ctrl+shift+backspace change_font_size all 0


# -----------------------------------------------------------------------------
# 9. CONFIGURATION UTILITIES
# -----------------------------------------------------------------------------

# Reload this configuration without restarting Kitty.
map ctrl+shift+f5 load_config_file

# Open Kitty's command palette.
map ctrl+shift+p kitten command_palette

# -----------------------------------------------------------------------------
# 10. Shadders
# -----------------------------------------------------------------------------
cursor_trail 5
# cursor_trail_decay 0.1 0.4
# cursor_trail_color #7aa2f7

custom_shaders cursor-trail-blaze

inactive_text_alpha 0.55

map ctrl+v paste_from_clipboard
