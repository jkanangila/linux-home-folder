# =============================================================================
# Kitty configuration
# WSLg | Dracula | UbuntuMono | Neovim workflow
# File: ~/.config/kitty/kitty.conf
# =============================================================================


# -----------------------------------------------------------------------------
# 1. FONT
# -----------------------------------------------------------------------------

font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Make the cursor easy to see.
cursor_shape block
cursor_blink_interval 0


# -----------------------------------------------------------------------------
# 2. DRACULA COLORS
# -----------------------------------------------------------------------------

foreground              #f8f8f2
background              #282a36
selection_foreground    #ffffff
selection_background    #44475a

cursor                  #f8f8f2
cursor_text_color       #282a36

# Normal ANSI colors
color0  #21222c
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #f8f8f2

# Bright ANSI colors
color8  #6272a4
color9  #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# Selection, URL, and search highlighting
url_color               #8be9fd
active_border_color     #bd93f9
inactive_border_color   #44475a
bell_border_color       #ff5555


# -----------------------------------------------------------------------------
# 3. WINDOW APPEARANCE
# -----------------------------------------------------------------------------

# Padding around terminal text, measured in points.
window_padding_width 8

# Keep normal window decorations for easier resizing under WSLg.
hide_window_decorations no
remember_window_size yes

# Optional subtle transparency. Set to 1.0 for a fully opaque background.
background_opacity 1

# Reduce visual noise.
enable_audio_bell no
visual_bell_duration 0.0


# -----------------------------------------------------------------------------
# 4. SCROLLBACK
# -----------------------------------------------------------------------------

scrollback_lines 10000


# -----------------------------------------------------------------------------
# 5. TABS
# -----------------------------------------------------------------------------

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Use the Dracula palette for tab states.
active_tab_foreground   #282a36
active_tab_background   #bd93f9
inactive_tab_foreground #f8f8f2
inactive_tab_background #44475a


# -----------------------------------------------------------------------------
# 6. SPLITS AND PANE NAVIGATION
# -----------------------------------------------------------------------------
# Use the splits layout by default.
enabled_layouts splits

# Split into top/bottom panes.
map ctrl+alt+h launch --location=hsplit --cwd=current
# Split into left/right panes.
map ctrl+alt+v launch --location=vsplit --cwd=current

# Move focus between neighboring panes.
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down

# Switch layouts.
map ctrl+shift+l next_layout
map ctrl+alt+z toggle_layout stack

# Enlarge the focused pane and restore the previous layout on repeat.
map ctrl+alt+m layout_action maximize


# -----------------------------------------------------------------------------
# 7. TABS AND WINDOWS
# -----------------------------------------------------------------------------

map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window

map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Navigate directly to tabs 1 through 9.
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9


# -----------------------------------------------------------------------------
# 8. FONT SIZE
# -----------------------------------------------------------------------------

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0


# -----------------------------------------------------------------------------
# 9. CONFIGURATION UTILITIES
# -----------------------------------------------------------------------------

# Reload this configuration without restarting Kitty.
map ctrl+shift+f5 load_config_file

# Open Kitty's command palette.
map ctrl+shift+p kitten command_palette

# -----------------------------------------------------------------------------
# 10. Shadders
# -----------------------------------------------------------------------------
cursor_trail 10
cursor_trail_decay 0.1 0.4
cursor_trail_color #ff6a00

custom_shaders cursor-trail-blaze

inactive_text_alpha 0.15
