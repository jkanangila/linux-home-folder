classic: false
blocks:
  - permission
  - user
  - size
  - date
  - name
color:
  when: auto
  theme: default
date: relative
dereference: false
display: almost-all
icons:
  when: auto
  theme: fancy
  separator: " "
indicators: false
layout: grid
recursion:
  enabled: false
  depth: 3
size: short
permission: octal
sorting:
  column: name
  reverse: false
  dir-grouping: first
no-symlink: false
total-size: false
hyperlink: never
header: false
